<style>
/* Layout: palco 3D no topo (coluna fixa à esquerda no desktop), HUD de orbes, mochila em grade, dicas de item em painel sobreposto */
:root{--bg:#14110e;--panel:#1f1a15;--panel2:#29221b;--line:#3d3329;--fg:#ecdfc6;--mut:#a8977d;--gold:#d9a845;--goldf:#1c1406;--ember:#d8613a;--moss:#8aa84f;--water:#6c9bbd;--sky:#2d3138;
--r0:#8d8a85;--r1:#ece4d4;--r2:#8aa2ff;--r3:#ecd457;--r4:#ee8d34;--mod:#9db0ff;--upc:#7fdc5b;--dnc:#ff6a4a;--bronze:#6b5536;
--fd:'Pirata One','Luminari',Georgia,serif;--fl:'IM Fell English',Georgia,'Times New Roman',serif;--fb:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--fg);font:15px/1.45 var(--fb);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
*{box-sizing:border-box}
#app{max-width:1040px;margin:0 auto;padding-block:8px calc(80px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:10px}
#side,#main{display:grid;gap:10px;min-width:0;align-content:start}
@media(min-width:900px){#app{grid-template-columns:minmax(0,440px) minmax(0,1fr);align-items:start}#side{position:sticky;top:calc(8px + env(safe-area-inset-top,0px))}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-width:0}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ti{font-family:var(--fd);font-size:23px;line-height:1.1;letter-spacing:.01em;color:var(--gold);text-wrap:balance}

.cnt{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:center}

.orb{display:flex;align-items:center;gap:6px;min-width:0}

.orb .o::after{content:"";position:absolute;left:9px;right:9px;top:4px;height:8px;border-radius:50%;background:rgba(255,255,255,.2)}

.orb .v{font:700 15px/1 var(--fb);font-variant-numeric:tabular-nums;text-shadow:1px 1px 0 #000}
.orb .l{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}

/* palco */

#cv{display:block;width:100%;aspect-ratio:528/432;max-height:46vh;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:pan-y;cursor:grab;background:#0b0a09}

#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ov{position:absolute;left:8px;right:8px;bottom:6px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font:13px/1.2 var(--fb);color:#f3e7cc;text-shadow:1px 1px 0 #000;font-variant-numeric:tabular-nums}

.hb{position:absolute;width:44px;height:6px;background:#b81f16;border:1px solid #000;transform:translate(-50%,-100%)}

.sp{position:absolute;min-width:26px;height:26px;padding:0 5px;border-radius:13px;display:grid;place-items:center;font:800 14px/1 var(--fb);color:#fff;text-shadow:1px 1px 0 #000;transform:translate(-50%,-50%);animation:sp 1.15s ease-out forwards;border:1px solid #000}

.sp.m{background:radial-gradient(circle at 40% 35%,#5b9cf0,#1d3f8c 70%)}
.sp.h{background:radial-gradient(circle at 40% 35%,#6fe05a,#1f7a16 70%)}

small,.mut{color:var(--mut)}.no{color:var(--ember)}
.bt{display:flex;gap:6px;flex-wrap:wrap}
.sec{font-family:var(--fd);font-size:19px;color:var(--gold);margin:0 0 4px}
.sub{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:10px 0 0}
.st{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;margin-top:6px}
.it{position:relative;aspect-ratio:1;min-height:0;padding:0;display:grid;place-items:center;font-size:25px;border-radius:5px;
 background:radial-gradient(circle at 50% 58%,color-mix(in srgb,var(--rc) 26%,transparent),#0f0d0b 72%);border:1px solid color-mix(in srgb,var(--rc) 60%,var(--line))}

.it .e{position:absolute;left:3px;top:2px;font:800 10px/1 var(--fb);color:var(--goldf);background:var(--gold);border-radius:3px;padding:2px 3px}

.tw{position:fixed;inset:0;z-index:30;display:grid;align-items:end;justify-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}

.tt{--rc:var(--r1);position:relative;width:min(430px,100%);max-height:84vh;overflow:auto;overscroll-behavior:contain;border-radius:6px;padding:16px 16px 14px;
 background:linear-gradient(180deg,color-mix(in srgb,var(--rc) 9%,#16120e),#0b0907 60%);border:1px solid color-mix(in srgb,var(--rc) 70%,#000);
 box-shadow:0 0 0 1px #000,0 0 26px -8px var(--rc),0 24px 50px rgba(0,0,0,.65);animation:ttIn .32s cubic-bezier(.2,.9,.3,1.25)}
@keyframes ttIn{from{opacity:0;transform:translateY(22px) scale(.95)}}
.tt.r4{animation:ttIn .32s cubic-bezier(.2,.9,.3,1.25),gl4 2.6s ease-in-out .35s infinite}

.tt.r0{background:repeating-linear-gradient(118deg,transparent 0 22px,rgba(255,255,255,.025) 22px 23px),linear-gradient(180deg,#151413,#0b0a09);filter:saturate(.6)}
.tt .cn{position:absolute;width:14px;height:14px;border:2px solid var(--rc);opacity:.8;pointer-events:none}
.cn.a{left:4px;top:4px;border-right:0;border-bottom:0}.cn.b{right:4px;top:4px;border-left:0;border-bottom:0}.cn.c{left:4px;bottom:4px;border-right:0;border-top:0}.cn.d{right:4px;bottom:4px;border-left:0;border-top:0}
.tt .x{position:absolute;right:10px;top:10px;min-height:34px;width:34px;padding:0;z-index:2}
.tt .fx{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.fx .em{position:absolute;bottom:-6px;left:var(--x);width:3px;height:3px;border-radius:50%;background:var(--rc);box-shadow:0 0 6px var(--rc);opacity:0;animation:rise 3.4s linear var(--d) infinite}
@keyframes rise{0%{opacity:0;transform:translate(0,0)}12%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-260px)}}
.fx .tw4{position:absolute;left:var(--x);top:var(--y);width:9px;height:9px;opacity:0;animation:tw 2.6s ease-in-out var(--d) infinite;background:radial-gradient(var(--rc),transparent 65%);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.9;transform:scale(1)}}
.th{display:flex;gap:12px;align-items:center;position:relative;padding-right:30px}
.th .ic{width:54px;height:54px;flex:none;display:grid;place-items:center;font-size:30px;border-radius:6px;border:1px solid var(--rc);background:radial-gradient(circle,color-mix(in srgb,var(--rc) 30%,transparent),#0b0907 70%)}
.tn{font-family:var(--fd);font-size:27px;line-height:1.02;color:var(--rc);text-wrap:balance}
.tt.r2 .tn,.tt.r3 .tn,.tt.r4 .tn{background:linear-gradient(100deg,var(--rc) 42%,#fff8e4 50%,var(--rc) 58%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 3.4s linear infinite}
.tt.r2 .tn{animation-duration:5s}
@keyframes shim{from{background-position:140% 0}to{background-position:-40% 0}}
.rb{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--rc);opacity:.9;margin-top:3px}
.rb span{color:var(--mut)}
.orn{height:9px;margin:12px 0 8px;background:radial-gradient(circle,var(--rc) 2px,transparent 3px) center/9px 9px no-repeat,linear-gradient(90deg,transparent,color-mix(in srgb,var(--rc) 70%,transparent),transparent) center/100% 1px no-repeat}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:14px;position:relative}
.ln{opacity:0;animation:lnIn .4s ease-out forwards;animation-delay:calc(var(--i)*70ms + 140ms);display:flex;justify-content:space-between;gap:10px;align-items:baseline}
@keyframes lnIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.ln.bs{color:var(--fg)}.ln.af{color:var(--mod)}.ln.wk{color:var(--mut)}
.ln em{font-style:italic;font-size:11.5px;color:var(--mut);flex:none;text-align:right}

.cmp{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:13.5px;position:relative}
.cmp .ch{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.cmp ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.cmp .up{color:var(--upc)}.cmp .dn{color:var(--dnc)}
.cmp .vd{margin-top:6px;font-weight:700}
.ta{display:flex;gap:8px;margin-top:14px;position:relative}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--panel);border-top:1px solid var(--line);padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.it.cs::after{content:"";position:absolute;left:4px;bottom:4px;width:7px;height:7px;border-radius:50%;background:var(--upc);box-shadow:0 0 0 1px #000}
.xp{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px}

.xb i{display:block;height:100%;background:linear-gradient(90deg,#9a7020,#ffd76a);transition:width .5s}
.ptb{min-height:30px;padding:2px 9px;font-size:12px;background:var(--gold);color:var(--goldf);border-color:#8f6a22;font-weight:800;animation:orbP 1.2s ease-in-out infinite;--c:var(--gold)}
.sp.x{background:linear-gradient(#ffe48a,#c4901c);color:#2a1a04;text-shadow:none;border-radius:4px;height:22px;font-size:12px}
.lvb{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--fd);font-size:40px;color:#ffe08a;text-shadow:0 0 12px #e09a20,0 2px 0 #000,0 0 30px #ffb030;pointer-events:none;white-space:nowrap;animation:lvA 2.4s ease-out forwards}
@keyframes lvA{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}25%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%)}}
.np{position:absolute;transform:translate(-50%,-100%);text-align:center;white-space:nowrap;font:700 12px/1.1 var(--fb);color:#ffe36a;text-shadow:1px 1px 0 #000,-1px 0 0 #000,0 -1px 0 #000,1px 0 0 #000;pointer-events:none}
.np small{display:block;font-weight:600;font-size:10px;color:#cfe3ff}.np.e{color:#ff6b55}
.hero .rn{font-family:var(--fd);font-size:28px;color:var(--gold);line-height:1}
.hero .rd{font-family:var(--fl);font-size:16px;color:var(--fg);margin:4px 0 6px}
.at{display:grid;grid-template-columns:1fr auto auto;gap:6px 10px;align-items:center;margin-top:6px}

</style>
